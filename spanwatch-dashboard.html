<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMS Project Monitor — Tracked Movable Bridge Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

  :root{
    --navy:#1B365D; --navy-deep:#142844; --steel:#71B2C9; --coral:#E5554F; --coral-dark:#C9433D; --mint:#91D6AC;
    --charcoal:#373A36; --off-white:#F6F7F8; --line:#E4E7E9;
    --text-muted: #6B7178; --card-bg: #FFFFFF; --card-border: #E4E7E9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family:'Montserrat',sans-serif; background:var(--off-white); color:var(--charcoal); min-height:100vh; }

  header { padding: 26px 40px; border-bottom: 1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; background: var(--navy); }
  .brand { display:flex; align-items:center; gap:10px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; text-transform:uppercase; letter-spacing:0.01em; color:#FFFFFF; }
  .brand .dot { width:10px; height:10px; border-radius:50%; background:var(--coral); }
  .brand-logo-wrap { background:#FFFFFF; padding:5px 10px; display:flex; align-items:center; }
  .brand-logo { height:30px; width:auto; flex-shrink:0; display:block; }
  .meta { font-size:13px; color: rgba(255,255,255,0.75); }
  .meta b { color: var(--steel); }

  .toolbar { padding: 24px 40px 0; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .toolbar input[type=text] {
    background: #FFFFFF; border:1px solid var(--line); border-radius:0;
    padding:10px 14px; color:var(--charcoal); font-family:'Montserrat',sans-serif; font-size:14px; min-width:220px;
  }
  .toolbar select {
    background: #FFFFFF; border:1px solid var(--line); border-radius:0;
    padding:10px 14px; color:var(--charcoal); font-family:'Montserrat',sans-serif; font-size:14px;
  }
  .toolbar .count { font-size:13px; color:var(--text-muted); }

  .grid { padding: 24px 40px 80px; display:grid; grid-template-columns: repeat(auto-fill, minmax(360px,1fr)); gap:18px; }

  .card { background: var(--card-bg); border:1px solid var(--card-border); border-top:3px solid var(--steel); border-radius:0; padding:24px; transition: border-color .2s, transform .2s, box-shadow .2s; }
  .card:hover { border-top-color: var(--coral); transform: translateY(-3px); box-shadow: 0 12px 24px rgba(27,54,93,0.08); }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .card-title { font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:19px; line-height:1.3; color:var(--navy); }
  .card-loc { font-size:13px; color:var(--text-muted); margin-top:3px; }
  .badge { font-family:'Barlow Condensed',sans-serif; font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:5px 10px; border-radius:0; white-space:nowrap; }
  .badge.planning    { background: rgba(113,178,201,0.18); color:#1B5080; border:1px solid rgba(113,178,201,0.45); }  /* steel blue  */
  .badge.pre-rfp     { background: rgba(218,158,40,0.20);  color:#6B4400; border:1px solid rgba(218,158,40,0.45); }  /* amber       */
  .badge.rfp         { background: rgba(229,85,79,0.20);   color:#A8332E; border:1px solid rgba(229,85,79,0.40); }  /* coral/red   */
  .badge.design      { background: rgba(145,214,172,0.28); color:#2A7045; border:1px solid rgba(145,214,172,0.55); } /* mint green  */
  .badge.construction{ background: rgba(27,54,93,0.14);    color:#1B365D; border:1px solid rgba(27,54,93,0.32); }   /* navy        */
  .badge.completed   { background: rgba(107,113,120,0.16); color:#3D4147; border:1px solid rgba(107,113,120,0.35); }/* slate grey  */

  .fresh-badge { display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; background:var(--coral); color:#FFFFFF; padding:3px 8px; margin-bottom:7px; }
  .fresh-badge.updated { background:var(--steel); }

  .type-tag { display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--navy); border:1px solid var(--navy); border-radius:0; padding:3px 8px; margin-bottom:14px; }

  .row { display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; border-top:1px solid var(--line); }
  .row .label { color: var(--text-muted); }
  .row .val { text-align:right; max-width:60%; }

  .firms { margin-top:10px; }
  .firms .label { font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); margin-bottom:6px; }
  .firm-pill { display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600; background: rgba(113,178,201,0.10); border:1px solid rgba(113,178,201,0.4); border-radius:0; color:var(--navy); padding:4px 9px; margin:0 5px 5px 0; }
  .firm-pill.lead { background: rgba(229,85,79,0.12); border-color: var(--coral); color: var(--coral-dark); }

  .card-footer { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-muted); }
  .card-footer a { color:var(--coral-dark); text-decoration:none; font-weight:600; }
  .card-footer a:hover { text-decoration:underline; }

  .contact-line { font-size:12px; color:var(--text-muted); margin-top:4px; }
  .contact-line .contact-name { font-weight:600; color:var(--navy); }
  .contact-line a { color:var(--coral-dark); text-decoration:none; }
  .contact-line a:hover { text-decoration:underline; }
  .row .val a { color:var(--coral-dark); text-decoration:none; }
  .row .val a:hover { text-decoration:underline; }

  .updates-banner { margin:24px 40px 0; padding:16px 22px; background:#FFFFFF; border:1px solid var(--card-border); border-left:4px solid var(--coral); display:none; }
  .updates-banner.has-updates { display:block; }
  .updates-banner-title { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.07em; text-transform:uppercase; color:var(--navy); margin-bottom:10px; }
  .updates-banner-title .as-of { font-weight:500; color:var(--text-muted); text-transform:none; letter-spacing:normal; }
  .updates-list { display:flex; flex-wrap:wrap; gap:8px 10px; }
  .update-chip { display:inline-flex; align-items:center; gap:6px; font-family:'Montserrat',sans-serif; font-size:13px; color:var(--charcoal); background:var(--off-white); border:1px solid var(--line); padding:6px 12px 6px 10px; text-decoration:none; cursor:pointer; transition: border-color .15s, transform .15s; }
  .update-chip:hover { border-color: var(--steel); transform: translateY(-1px); }
  .card.jump-highlight { animation: jumpHighlight 1.8s ease; }
  @keyframes jumpHighlight { 0%, 100% { box-shadow: none; } 15% { box-shadow: 0 0 0 3px var(--steel); } }
  .update-chip .tag { font-family:'Barlow Condensed',sans-serif; font-size:10.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:2px 7px; color:#FFFFFF; }
  .update-chip .tag.new { background:var(--coral); }
  .update-chip .tag.updated { background:var(--steel); }

  /* DELETE BUTTON */
  .btn-delete { background:none; border:none; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); padding:0; line-height:1; transition:color .15s; }
  .btn-delete:hover { color:var(--coral); }

  /* CONFIRMATION MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(27,54,93,0.50); display:flex; align-items:center; justify-content:center; z-index:1000; opacity:0; pointer-events:none; transition:opacity .2s; }
  .modal-overlay.visible { opacity:1; pointer-events:all; }
  .modal-box { background:#FFFFFF; border-top:4px solid var(--coral); padding:32px 36px; max-width:440px; width:90%; font-family:'Montserrat',sans-serif; }
  .modal-title { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; text-transform:uppercase; letter-spacing:0.04em; color:var(--navy); margin-bottom:12px; }
  .modal-body { font-size:13.5px; color:var(--charcoal); line-height:1.65; margin-bottom:26px; }
  .modal-body strong { color:var(--navy); }
  .modal-actions { display:flex; gap:12px; justify-content:flex-end; }
  .modal-btn { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; padding:10px 22px; border:none; cursor:pointer; }
  .modal-btn.cancel { background:var(--off-white); color:var(--charcoal); border:1px solid var(--line); }
  .modal-btn.cancel:hover { background:var(--line); }
  .modal-btn.confirm { background:var(--coral); color:#FFFFFF; }
  .modal-btn.confirm:hover { background:var(--coral-dark); }

  .empty { padding:80px 20px; text-align:center; color:var(--text-muted); grid-column:1/-1; }
  footer { text-align:center; padding:30px; font-size:12.5px; color:var(--text-muted); border-top:1px solid var(--line); background:#FFFFFF; }

  /* ADD PROJECT BUTTON */
  .btn-add { background:var(--coral); border:none; color:#FFFFFF; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; padding:10px 18px; cursor:pointer; white-space:nowrap; transition:background .15s; }
  .btn-add:hover { background:var(--coral-dark); }

  /* ADD PROJECT MODAL */
  .add-modal-overlay { position:fixed; inset:0; background:rgba(27,54,93,0.55); display:flex; align-items:flex-start; justify-content:center; z-index:1001; opacity:0; pointer-events:none; transition:opacity .2s; overflow-y:auto; padding:40px 20px; }
  .add-modal-overlay.visible { opacity:1; pointer-events:all; }
  .add-modal-box { background:#FFFFFF; border-top:4px solid var(--coral); padding:32px 36px; max-width:600px; width:100%; font-family:'Montserrat',sans-serif; }
  .add-modal-title { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; text-transform:uppercase; letter-spacing:0.04em; color:var(--navy); margin-bottom:24px; }
  .form-group { margin-bottom:14px; }
  .form-label { display:block; font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--navy); margin-bottom:5px; }
  .form-label .req { color:var(--coral); }
  .form-input, .form-select, .form-textarea { width:100%; padding:9px 12px; border:1px solid var(--line); background:#FFFFFF; color:var(--charcoal); font-family:'Montserrat',sans-serif; font-size:13px; border-radius:0; outline:none; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--steel); }
  .form-textarea { min-height:72px; resize:vertical; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-error { font-size:11.5px; color:var(--coral); margin-top:3px; display:none; }
  .add-modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:24px; padding-top:20px; border-top:1px solid var(--line); }
</style>
</head>

function getOwnerContact(owner) {
  return OWNER_CONTACTS[owner] || null;
}

function getFirmContactsForString(str) {
  if (!str) return [];
  return FIRM_CONTACTS.filter(f => str.includes(f.match));
}

function getAllFirmContacts(p) {
  const matches = [
    ...getFirmContactsForString(p.leadFirm),
    ...(p.competingFirms || []).flatMap(f => getFirmContactsForString(f))
  ];
  const seen = new Set();
  return matches.filter(f => !seen.has(f.name) && seen.add(f.name));
}

// USER-ADDED PROJECTS — persisted in localStorage so manual entries survive refresh
// ---------------------------------------------------------------------------
const HMS_ADDED_KEY = 'hms_added_projects';

function getAddedProjects() {
  try { return JSON.parse(localStorage.getItem(HMS_ADDED_KEY) || '[]'); }
  catch(e) { return []; }
}

function saveAddedProject(proj) {
  const existing = getAddedProjects();
  existing.push(proj);
  try { localStorage.setItem(HMS_ADDED_KEY, JSON.stringify(existing)); } catch(e) {}
}

function getAllProjects() {
  return [...PROJECTS, ...getAddedProjects()];
}

function openAddModal() {
  document.getElementById('addProjectForm').reset();
  document.querySelectorAll('.form-error').forEach(el => el.style.display = 'none');
  document.getElementById('addModal').classList.add('visible');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('visible');
}

function submitAddProject() {
  const val = id => document.getElementById(id).value.trim();
  const required = [
    ['addName',      'addNameErr'],
    ['addLocation',  'addLocErr'],
    ['addOwner',     'addOwnerErr'],
    ['addSource',    'addSrcErr'],
    ['addSourceUrl', 'addSrcUrlErr']
  ];
  let valid = true;
  required.forEach(([fieldId, errId]) => {
    const err = document.getElementById(errId);
    if (!val(fieldId)) { err.style.display = 'block'; valid = false; }
    else { err.style.display = 'none'; }
  });
  if (!valid) return;

  const today = new Date().toISOString().slice(0, 10);
  const competingRaw = val('addCompeting');
  const competingFirms = competingRaw ? competingRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

  const proj = {
    id: 'user-' + Date.now(),
    name:          val('addName'),
    location:      val('addLocation'),
    type:          document.getElementById('addType').value,
    stage:         document.getElementById('addStage').value,
    owner:         val('addOwner'),
    leadFirm:      val('addLeadFirm') || 'Not yet publicly confirmed',
    competingFirms,
    estValue:      val('addEstValue') || 'TBD',
    timeline:      val('addTimeline') || 'TBD',
    source:        val('addSource'),
    sourceUrl:     val('addSourceUrl'),
    dateAdded:     today,
    lastUpdated:   today,
    notes:         val('addNotes')
  };

  saveAddedProject(proj);
  closeAddModal();
  renderUpdatesBanner();
  render();
}

const HMS_DELETED_KEY = 'hms_deleted_project_ids';

function getDeletedIds() {
  try { return new Set(JSON.parse(localStorage.getItem(HMS_DELETED_KEY) || '[]')); }
  catch(e) { return new Set(); }
}

function saveDeletedId(id) {
  const ids = getDeletedIds();
  ids.add(id);
  try { localStorage.setItem(HMS_DELETED_KEY, JSON.stringify([...ids])); } catch(e) {}
}

function confirmDelete(id) {
  const proj = getAllProjects().find(p => p.id === id);
  const name = proj ? proj.name : id;
  document.getElementById('deleteModalBody').innerHTML =
    `Are you sure you want to delete <strong>${name}</strong>?` +
    `<br><br>Deletions cannot be restored.`;
  document.getElementById('deleteModalConfirm').onclick = () => executeDelete(id);
  document.getElementById('deleteModal').classList.add('visible');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('visible');
}

function executeDelete(id) {
  saveDeletedId(id);
  closeDeleteModal();
  renderUpdatesBanner();
  render();
}

// Close modals if user clicks the backdrop
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('deleteModal').addEventListener('click', function(e) {
    if (e.target === this) closeDeleteModal();
  });
  document.getElementById('addModal').addEventListener('click', function(e) {
    if (e.target === this) closeAddModal();
  });
});

// ---------------------------------------------------------------------------
// RENDER LOGIC (no edits needed by the scheduled task below this line)
// ---------------------------------------------------------------------------
function stageBadgeClass(stage) {
  const map = {
    "Planning / CIP": "planning",
    "Pre-RFP": "pre-rfp",
    "RFQ/RFP Issued": "rfp",
    "Design": "design",
    "Under Construction": "construction",
    "Completed": "completed"
  };
  return map[stage] || "planning";
}

function formatDateShort(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function freshBadgeHtml(p) {
  const updatedStr = p.lastUpdated || p.dateAdded;
  const updatedDate = new Date(updatedStr + 'T00:00:00');
  const now = new Date();
  const diffDays = Math.floor((now - updatedDate) / 86400000);
  if (isNaN(diffDays) || diffDays < 0 || diffDays >= 7) return '';
  const isNew = updatedStr === p.dateAdded;
  const label = isNew ? 'New' : 'Updated';
  return `<div class="fresh-badge${isNew ? '' : ' updated'}">${label} ${formatDateShort(updatedDate)}</div>`;
}

function renderUpdatesBanner() {
  const banner = document.getElementById('updatesBanner');
  // Driven by the SpanWatch nightly check: anything the most recent run
  // touched has lastUpdated === LAST_CHECKED. dateAdded === lastUpdated means
  // it's a brand-new listing; otherwise it's an existing project the check
  // changed something on.
  const deletedIds = getDeletedIds();
  const todays = PROJECTS.filter(p => !deletedIds.has(p.id) && p.lastUpdated === LAST_CHECKED);

  if (todays.length === 0) {
    banner.className = 'updates-banner';
    banner.innerHTML = '';
    return;
  }

  banner.className = 'updates-banner has-updates';
  banner.innerHTML = `
    <div class="updates-banner-title">Latest from the nightly check <span class="as-of">— ${LAST_CHECKED}</span></div>
    <div class="updates-list">
      ${todays.map(p => {
        const isNew = p.lastUpdated === p.dateAdded;
        return `<a class="update-chip" href="#project-${p.id}" onclick="jumpToProject('${p.id}');return false;"><span class="tag ${isNew ? 'new' : 'updated'}">${isNew ? 'New' : 'Updated'}</span>${p.name}</a>`;
      }).join('')}
    </div>
  `;
}

function render() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const typeF = document.getElementById('typeFilter').value;
  const stageF = document.getElementById('stageFilter').value;
  const grid = document.getElementById('grid');

  const deletedIds = getDeletedIds();
  const active = getAllProjects().filter(p => !deletedIds.has(p.id));

  const filtered = active.filter(p => {
    const matchesQ = !q || (p.name + p.location + (p.leadFirm||'') + (p.competingFirms||[]).join(' ')).toLowerCase().includes(q);
    const matchesType = !typeF || p.type === typeF;
    const matchesStage = !stageF || p.stage === stageF;
    return matchesQ && matchesType && matchesStage;
  });

  document.getElementById('resultCount').textContent = filtered.length + ' shown';
  document.getElementById('projectCount').textContent = active.length;
  document.getElementById('lastChecked').textContent = LAST_CHECKED;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">No tracked projects match these filters yet.</div>';
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const oc = getOwnerContact(p.owner);
    const firmContacts = getAllFirmContacts(p);
    return `
    <div class="card" id="project-${p.id}">
      <div class="card-top">
        <div>
          ${freshBadgeHtml(p)}
          <div class="card-title">${p.name}</div>
          <div class="card-loc">${p.location}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
          <button class="btn-delete" onclick="confirmDelete('${p.id}')">✕ Delete</button>
          <span class="badge ${stageBadgeClass(p.stage)}">${p.stage}</span>
        </div>
      </div>
      <span class="type-tag">${p.type}</span>
      <div class="row"><span class="label">Owner</span><span class="val">${p.owner}</span></div>
      ${oc ? `<div class="row"><span class="label">Owner contact</span><span class="val"><a href="https://${oc.website}" target="_blank" rel="noopener">${oc.website}</a> · ${oc.phone}</span></div>` : ''}
      <div class="row"><span class="label">Est. value</span><span class="val">${p.estValue || 'TBD'}</span></div>
      <div class="row"><span class="label">Timeline</span><span class="val">${p.timeline || 'TBD'}</span></div>
      <div class="firms">
        <div class="label">Engineering firm(s)</div>
        <span class="firm-pill${(p.leadFirm && p.leadFirm !== 'Not yet publicly confirmed') ? '' : ' lead'}">${p.leadFirm || 'Unconfirmed'}</span>
        ${(p.competingFirms||[]).map(f => `<span class="firm-pill">${f}</span>`).join('')}
        ${firmContacts.map(f => `<div class="contact-line"><span class="contact-name">${f.name}</span> — <a href="https://${f.website}" target="_blank" rel="noopener">${f.website}</a> · ${f.phone}</div>`).join('')}
      </div>
      ${p.notes ? `<div class="row" style="border-top:1px solid #E4E7E9; margin-top:10px; padding-top:10px;"><span class="val" style="text-align:left; max-width:100%;">${p.notes}</span></div>` : ''}
      <div class="card-footer">
        <span>Added ${p.dateAdded}</span>
        <a href="${p.sourceUrl}" target="_blank" rel="noopener">Source: ${p.source} →</a>
      </div>
    </div>
  `;
  }).join('');
}

function jumpToProject(id) {
  document.getElementById('searchBox').value = '';
  document.getElementById('typeFilter').value = '';
  document.getElementById('stageFilter').value = '';
  render();
  const el = document.getElementById('project-' + id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('jump-highlight');
  // restart animation even if clicked twice in a row
  void el.offsetWidth;
  el.classList.add('jump-highlight');
  setTimeout(() => el.classList.remove('jump-highlight'), 1900);
}

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('stageFilter').addEventListener('change', render);
renderUpdatesBanner();
render();
</script>

<!-- ADD PROJECT MODAL -->
<div class="add-modal-overlay" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
  <div class="add-modal-box">
    <div class="add-modal-title" id="addModalTitle">Add a Project</div>
    <form id="addProjectForm" onsubmit="return false;">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="addName">Project Name <span class="req">*</span></label>
          <input class="form-input" id="addName" type="text" placeholder="Full project name">
          <div class="form-error" id="addNameErr">Required</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="addLocation">Location <span class="req">*</span></label>
          <input class="form-input" id="addLocation" type="text" placeholder="City, State (waterway)">
          <div class="form-error" id="addLocErr">Required</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="addType">Structure Type</label>
          <select class="form-select" id="addType">
            <option>Bascule</option>
            <option>Vertical Lift</option>
            <option>Swing</option>
            <option>Retractable/Folding</option>
            <option>Curling</option>
            <option>Lock Gate</option>
            <option>Dam Gate</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="addStage">Stage</label>
          <select class="form-select" id="addStage">
            <option>Planning / CIP</option>
            <option>Pre-RFP</option>
            <option>RFQ/RFP Issued</option>
            <option>Design</option>
            <option>Under Construction</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="addOwner">Owner <span class="req">*</span></label>
        <input class="form-input" id="addOwner" type="text" placeholder="Agency or owner name">
        <div class="form-error" id="addOwnerErr">Required</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="addLeadFirm">Lead Firm</label>
          <input class="form-input" id="addLeadFirm" type="text" placeholder="Engineering firm (or leave blank)">
        </div>
        <div class="form-group">
          <label class="form-label" for="addCompeting">Competing Firms</label>
          <input class="form-input" id="addCompeting" type="text" placeholder="Comma-separated if multiple">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="addEstValue">Est. Value</label>
          <input class="form-input" id="addEstValue" type="text" placeholder="e.g. $45M">
        </div>
        <div class="form-group">
          <label class="form-label" for="addTimeline">Timeline</label>
          <input class="form-input" id="addTimeline" type="text" placeholder="e.g. RFP expected Q3 2026">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="addSource">Source Name <span class="req">*</span></label>
          <input class="form-input" id="addSource" type="text" placeholder="Publication or agency">
          <div class="form-error" id="addSrcErr">Required</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="addSourceUrl">Source URL <span class="req">*</span></label>
          <input class="form-input" id="addSourceUrl" type="url" placeholder="https://...">
          <div class="form-error" id="addSrcUrlErr">Required</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="addNotes">Notes</label>
        <textarea class="form-textarea" id="addNotes" placeholder="Any additional context about the project..."></textarea>
      </div>
    </form>
    <div class="add-modal-actions">
      <button class="modal-btn cancel" onclick="closeAddModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="submitAddProject()">Add Project</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRMATION MODAL -->
<div class="modal-overlay" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
  <div class="modal-box">
    <div class="modal-title" id="deleteModalTitle">Remove Project</div>
    <div class="modal-body" id="deleteModalBody"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="modal-btn confirm" id="deleteModalConfirm">Yes, Remove It</button>
    </div>
  </div>
</div>

</body>
